[package]
name = "vaulti-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaulti desktop/mobile app"

[lib]
name = "vaulti_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vaulti-core.workspace = true
vaulti-sync.workspace = true
serde.workspace = true
uuid.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
# Save/open dialogs + file access for backups (dialog-picked paths only).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
dirs = "6"
zeroize = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Mobile-only (the crate is empty on desktop); scans the desktop's pairing QR code.
tauri-plugin-barcode-scanner = "2"

[package]
name = "vaulti-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaulti P2P transport: device pairing and sync over iroh"

[dependencies]
vaulti-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22"
data-encoding = "2"
getrandom = "0.3"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

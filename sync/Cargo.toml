[package]
name = "vaulti-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaulti P2P transport: device pairing and sync over iroh"

[dependencies]
vaulti-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["sync"] }
n0-future = "0.3"
base64 = "0.22"
data-encoding = "2"
getrandom = "0.3"
sha2 = "0.10"
tracing = "0.1"

# Desktop and phones; not available in the browser extension (WebAssembly).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

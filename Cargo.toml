[workspace]
resolver = "2"
members = ["core", "sync", "cli", "app/src-tauri", "extension/wasm"]
# Host builds skip the app (needs WebKitGTK); build it via scripts/docker.sh.
default-members = ["core", "sync", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vaulti-core = { path = "core" }
vaulti-sync = { path = "sync" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = true

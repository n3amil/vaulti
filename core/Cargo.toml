[package]
name = "vaulti-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaulti core: vault format, crypto, recovery"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
base64 = "0.22"
data-encoding = "2"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"

[dev-dependencies]
tempfile = "3"

name: Android

# Builds an installable (debug-signed) APK for arm64 phones.
# Run manually, or it runs for release tags. The Android project
# (app/src-tauri/gen/android) is generated fresh by `tauri android init`.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK/NDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - run: npm install -g @tauri-apps/cli@2.12.1

      - name: Generate Android project
        working-directory: app
        run: |
          tauri android init --ci
          tauri icon icon.png

      - name: Build APK
        working-directory: app
        run: tauri android build --ci --debug --apk --target aarch64

      - run: |
          mkdir -p out
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/Vaulti-android-arm64-debug.apk \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

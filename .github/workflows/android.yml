name: Android

# Builds an optimized, signed APK for arm64 phones.
# Run manually; release.yml calls it for version tags. The Android project
# (app/src-tauri/gen/android) is generated fresh by `tauri android init`.
#
# Signing: with repo secrets ANDROID_KEYSTORE_B64 (base64 PKCS#12) and
# ANDROID_KEYSTORE_PASSWORD the APK is signed with that permanent key, so
# updates install over each other. Without them a throwaway test key is used
# (uninstall before installing a newer build).
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK/NDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android

      # Project-local CLI: the generated Gradle project calls it back via npm.
      - name: Tauri CLI
        working-directory: app
        run: npm install

      - name: Generate Android project
        working-directory: app
        run: |
          npx tauri android init --ci
          npx tauri icon icon.png
          # R8 shrinking breaks the barcode-scanner plugin (crash on scan; it ships
          # no keep rules). The Rust lib stays optimized; this only skips Java/Kotlin shrinking.
          G=src-tauri/gen/android/app/build.gradle.kts
          perl -0pi -e 's/(optimization \{\s*enable = )true/${1}false/ or die "optimization block not found\n"' "$G"
          grep -A2 'optimization {' "$G"

      - name: Build APK (release, unsigned)
        working-directory: app
        run: npx tauri android build --ci --apk --target aarch64

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "${KS_B64:-}" ]; then
            echo "Signing with the permanent release key"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: signing with a throwaway test key"
            KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 -alias vaulti \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$KS_PASS" \
              -dname "CN=Vaulti test build" -noprompt
          fi
          export KS_PASS
          # 16 KB page alignment for native libs (Android 15+), fall back for older build-tools.
          "$BT/zipalign" -P 16 -f 4 "$APK" "$RUNNER_TEMP/aligned.apk" || "$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-pass env:KS_PASS --out out/Vaulti-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs out/Vaulti-android-arm64.apk | head -3
          rm -f "$RUNNER_TEMP/ks.p12"
          ls -lh out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

name: Android

# Builds an installable (debug-signed) APK for arm64 phones.
# Run manually; release.yml calls it for version tags. The Android project
# (app/src-tauri/gen/android) is generated fresh by `tauri android init`.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK/NDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android

      # Project-local CLI: the generated Gradle project calls it back via npm.
      - name: Tauri CLI
        working-directory: app
        run: npm install

      - name: Generate Android project
        working-directory: app
        run: |
          npx tauri android init --ci
          npx tauri icon icon.png

      - name: Build APK
        working-directory: app
        run: npx tauri android build --ci --debug --apk --target aarch64

      - run: |
          mkdir -p out
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/Vaulti-android-arm64-debug.apk \;
          ls -lh out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

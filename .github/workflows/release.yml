name: Release

# Push a tag like v0.1.0 to build the .deb, .flatpak, macOS .dmg, Android APK and browser extensions and
# publish a GitHub release. Tags with a suffix (v0.1.0-alpha.1) become
# pre-releases. Run manually to just get the artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same Docker build as locally (Debian bookworm, glibc 2.36).
      - run: scripts/docker.sh deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  flatpak:
    needs: deb
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb
          path: dist
      - run: cp dist/*.deb flatpak/vaulti.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: flatpak/io.github.n3amil.Vaulti.yml
          bundle: Vaulti.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same Docker build as locally (Rust → WebAssembly, then the Firefox/Chrome packages).
      - run: scripts/docker.sh extension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: extension/dist/*.zip
          if-no-files-found: error

  android:
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  macos:
    uses: ./.github/workflows/macos.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, flatpak, android, macos, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - run: |
          mkdir out
          cp artifacts/deb/*.deb out/
          find artifacts -name '*.flatpak' -exec cp {} out/ \;
          cp artifacts/android-apk/*.apk out/
          cp artifacts/macos-dmg/*.dmg out/
          cp artifacts/extension/*.zip out/
          ls -lh out
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: out/*
          generate_release_notes: true
          body: |
            > **Early test build.** Not audited. Don't store real secrets yet.

            ### Install
            - **Linux (Debian/Ubuntu):** `sudo apt install ./Vaulti_*_amd64.deb`
            - **Linux (Flatpak):** `flatpak install --user Vaulti.flatpak`
              (needs the GNOME 49 runtime from Flathub: `flatpak install flathub org.gnome.Platform//49`)
            - **macOS (Apple Silicon & Intel):** open `Vaulti-macos-universal.dmg`, drag Vaulti to Applications.
              Not signed yet: on first launch right-click Vaulti → Open (or run
              `xattr -dr com.apple.quarantine /Applications/Vaulti.app`).
            - **Android (arm64):** download `Vaulti-android-arm64.apk` on the phone and open it
              (allow installing from your browser). Alpha builds may be test-signed: if an update
              won't install, uninstall the old version first.
            - **Browser extension:** not in the stores yet. Firefox: unzip `vaulti-firefox-*.zip`,
              open `about:debugging` → This Firefox → Load Temporary Add-on → pick its `manifest.json`
              (removed when Firefox restarts). Chrome/Brave/Edge: unzip `vaulti-chrome-*.zip`,
              `chrome://extensions` → Developer mode → Load unpacked → pick the folder.

            ### Get started
            1. Create your vault on any device (computer or phone). Write down the backup code.
            2. On that device: **Devices → Pair new device**. On the new one choose
               **I already use Vaulti on another device** and scan the QR code. The browser extension
               takes the pairing code instead: copy it there and paste it into the extension.
            3. Check that both show the same 6-digit code and confirm.
            4. Unlock the new device with your master password. Devices sync whenever they're online together.

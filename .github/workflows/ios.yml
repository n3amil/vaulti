name: iOS

# Compile check: generates the Xcode project and builds the app for the iOS
# simulator, unsigned (no Apple account needed). Installing on iPhones /
# TestFlight needs an Apple Developer account and signing secrets (later).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', 'sync/**', 'Cargo.lock', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ios

      - name: Tools (XcodeGen generates the Xcode project)
        run: brew install xcodegen

      - name: Tauri CLI
        working-directory: app
        run: npm install

      - name: Generate iOS project
        working-directory: app
        run: |
          npx tauri ios init --ci
          npx tauri icon icon.png

      # tauri drives xcodebuild (the Xcode project calls back into the running CLI).
      - name: Build for the simulator (unsigned)
        working-directory: app
        run: npx tauri ios build --ci --debug --target aarch64-sim

      - run: find app/src-tauri/gen/apple/build -name '*.app' -maxdepth 6 | head -3
